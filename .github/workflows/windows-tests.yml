name: Validate Mewo

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse in Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\MewoClientFucker.ps1').Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.ToString() }
              exit 1
          }
      - name: Self-test Windows PowerShell 5.1
        shell: powershell
        run: |
          & .\MewoClientFucker.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Parse in PowerShell 7
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\MewoClientFucker.ps1').Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.ToString() }
              exit 1
          }
      - name: Self-test PowerShell 7
        shell: pwsh
        run: |
          & .\MewoClientFucker.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit 1 }
