name: Validate Mewo

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse in Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          Get-ChildItem -Filter '*.ps1' | ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                  $errors | ForEach-Object { Write-Error $_.ToString() }
                  throw ('PowerShell parse failed: ' + $_.Name)
              }
          }
      - name: Self-test Windows PowerShell 5.1
        shell: powershell
        run: |
          & .\MewoClientFucker.ps1 -SelfTest
          if (-not $?) { exit 1 }
      - name: Parse in PowerShell 7
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          Get-ChildItem -Filter '*.ps1' | ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                  $errors | ForEach-Object { Write-Error $_.ToString() }
                  throw ('PowerShell parse failed: ' + $_.Name)
              }
          }
      - name: Self-test PowerShell 7
        shell: pwsh
        run: |
          & .\MewoClientFucker.ps1 -SelfTest
          if (-not $?) { exit 1 }
